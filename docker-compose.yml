services:
  backend:
    build: .
    container_name: magnum-go-backend
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8000:8000"
  postgres:
    image: postgres:16
    container_name: magnum-go-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: magnum_go
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - magnum_go_postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: magnum-go-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
volumes:
  magnum_go_postgres_data: